<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- silkscreen example faceplate. Everything outside the "controls" layer
       is pre-rendered; each shape inside it marks one control's bounds. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363b"/>
      <stop offset="1" stop-color="#1f2023"/>
    </linearGradient>
  </defs>

  <rect width="300" height="200" fill="#121214"/>
  <rect x="4" y="4" width="292" height="192" rx="6" fill="url(#panel)" stroke="#4a4c52" stroke-width="1"/>

  <!-- Corner screws -->
  <g fill="#55585e" stroke="#2a2b2f" stroke-width="0.8">
    <circle cx="16" cy="16" r="4.5"/>
    <circle cx="284" cy="16" r="4.5"/>
    <circle cx="16" cy="184" r="4.5"/>
    <circle cx="284" cy="184" r="4.5"/>
  </g>
  <g stroke="#2a2b2f" stroke-width="1.2" stroke-linecap="round">
    <line x1="13" y1="16" x2="19" y2="16"/>
    <line x1="281" y1="16" x2="287" y2="16"/>
    <line x1="13" y1="184" x2="19" y2="184"/>
    <line x1="281" y1="184" x2="287" y2="184"/>
  </g>

  <!-- Legend "GAIN", drawn as strokes so no font is needed -->
  <g fill="none" stroke="#d8d8dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 132.21 23.64 A 5 7 0 1 0 133.53 31.96 L 133.53 29.5 L 130 29.5"/>
    <path d="M 138 36 L 143 22 L 148 36 M 140 31 L 146 31"/>
    <path d="M 157 22 L 157 36"/>
    <path d="M 166 36 L 166 22 L 176 36 L 176 22"/>
  </g>

  <!-- Scale ticks around the knob: 270 degrees, emphasised at min, centre, max -->
  <g stroke="#9a9ca3" stroke-width="1.6" stroke-linecap="round">
    <line x1="110.40" y1="149.60" x2="103.33" y2="156.67"/>
    <line x1="95.79" y1="127.61" x2="91.03" y2="129.16"/>
    <line x1="93.70" y1="101.08" x2="88.76" y2="100.30"/>
    <line x1="103.89" y1="76.50" x2="99.84" y2="73.56"/>
    <line x1="124.12" y1="59.21" x2="121.85" y2="54.76"/>
    <line x1="150.00" y1="54.00" x2="150.00" y2="44.00"/>
    <line x1="175.88" y1="59.21" x2="178.15" y2="54.76"/>
    <line x1="196.11" y1="76.50" x2="200.16" y2="73.56"/>
    <line x1="206.30" y1="101.08" x2="211.24" y2="100.30"/>
    <line x1="204.21" y1="127.61" x2="208.97" y2="129.16"/>
    <line x1="189.60" y1="149.60" x2="196.67" y2="156.67"/>
  </g>

  <g id="controls">
    <circle id="knob.gain" cx="150" cy="110" r="50" fill="#ff00ff"/>
  </g>
</svg>
