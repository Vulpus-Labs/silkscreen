[package]
name = "gain-web"
description = "The gain example's editor on a web page, its engine in an AudioWorklet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gain.workspace = true
silkscreen-host-web.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

# Fetch mode on the web only: features on a target-specific dependency are
# ignored when building for other targets, so native workspace builds keep
# gain's embedded PNGs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gain = { workspace = true, features = ["fetch"] }

# How `cargo silkscreen web` builds its page (silkscreen-tool).
[package.metadata.silkscreen.web]
engine = "gain-web-engine"
page = "web"

[lints]
workspace = true
