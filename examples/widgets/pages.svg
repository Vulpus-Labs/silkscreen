<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160">
  <!-- A page group (design/faceplates.md): three tabs over a region whose art and
       controls change with the tab. No text, so no fonts are needed. -->
  <rect width="240" height="160" fill="#1c1d20"/>
  <rect x="4" y="4" width="232" height="152" rx="6" fill="#2b2d31" stroke="#45474d"/>
  <g id="page.fx.0">
    <rect x="12" y="40" width="216" height="108" rx="4" fill="#23302a"/>
    <circle cx="60" cy="94" r="30" fill="none" stroke="#3f6b55" stroke-width="2"/>
  </g>
  <g id="page.fx.1">
    <rect x="12" y="40" width="216" height="108" rx="4" fill="#302a23"/>
    <rect x="128" y="50" width="32" height="90" rx="4" fill="none" stroke="#6b553f" stroke-width="2"/>
  </g>
  <g id="page.fx.2">
    <rect x="12" y="40" width="216" height="108" rx="4" fill="#2a2330"/>
    <path d="M30 140 L210 52" stroke="#553f6b" stroke-width="3"/>
  </g>
  <g id="controls">
    <rect id="tab.fx.0" x="12" y="12" width="68" height="22" fill="#f0f"/>
    <rect id="tab.fx.1" x="86" y="12" width="68" height="22" fill="#f0f"/>
    <rect id="tab.fx.2" x="160" y="12" width="68" height="22" fill="#f0f"/>
    <g data-page="fx.0">
      <rect id="knob.amount" x="35" y="69" width="50" height="50" fill="#f0f"/>
      <rect id="toggle.first_on" x="170" y="74" width="40" height="40" fill="#f0f"/>
    </g>
    <g data-page="fx.1">
      <rect id="fader.time" x="132" y="54" width="24" height="82" fill="#f0f"/>
      <rect id="toggle.second_on" x="170" y="74" width="40" height="40" fill="#f0f"/>
    </g>
    <g data-page="fx.2">
      <rect id="toggle.third_on" x="170" y="74" width="40" height="40" fill="#f0f"/>
    </g>
  </g>
</svg>
