[package]
name = "silkscreen-host-native"
description = "Native window host for silkscreen editors: baseview, presented through a CALayer (macOS) or softbuffer"
# The library's own version line, apart from the synths'.
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[dependencies]
silkscreen.workspace = true
baseview.workspace = true
keyboard-types.workspace = true
raw-window-handle.workspace = true
rfd.workspace = true

# softbuffer's macOS backend registers a fixed-name Objective-C class, which
# collides between two plugins in one process.
[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-quartz-core.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true

[lints]
workspace = true
