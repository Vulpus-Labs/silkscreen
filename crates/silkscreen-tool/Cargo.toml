[package]
name = "silkscreen-tool"
description = "Builds silkscreen plugins: CLAP bundles (signed, notarized, universal), web pages, and their deployment"
# The library's own version line, apart from the synths'.
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[lib]
name = "silkscreen_tool"

# `cargo install` it, then run `cargo silkscreen <command>` in any workspace.
[[bin]]
name = "cargo-silkscreen"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[lints]
workspace = true
