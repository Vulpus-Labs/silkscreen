[package]
name = "silkscreen-build"
description = "Build-time SVG faceplate pipeline for silkscreen: renders PNG scales and generates layout code"
# The library's own version line, apart from the synths'.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[dependencies]
silkscreen-core.workspace = true
silkscreen-model.workspace = true
silkscreen-text.workspace = true
resvg.workspace = true
usvg = { workspace = true, features = ["system-fonts"] }
roxmltree.workspace = true

[lints]
workspace = true
