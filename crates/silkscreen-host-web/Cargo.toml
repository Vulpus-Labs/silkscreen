[package]
name = "silkscreen-host-web"
description = "Web host for silkscreen editors: a canvas presenter driven by requestAnimationFrame"
# The library's own version line, apart from the synths'.
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[dependencies]
silkscreen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "console",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomException",
    "DomStringList",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Performance",
    "PointerEvent",
    "Response",
    "StorageManager",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Url",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
