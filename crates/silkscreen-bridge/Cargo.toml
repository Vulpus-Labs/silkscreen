[package]
name = "silkscreen-bridge"
description = "Lock-free bridge between a silkscreen editor and an audio engine"
# The library's own version line, apart from the synths'.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[features]
default = ["std"]
# Transports and test helpers. Without it, only the protocol (EngineEvent,
# codec, EngineLink) is available, for no_std engines.
std = ["dep:rtrb"]
# Test support: an allocation-counting global allocator.
testing = ["std"]

[dependencies]
rtrb = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests count allocations.
silkscreen-bridge = { path = ".", features = ["testing"] }

[lints]
workspace = true
