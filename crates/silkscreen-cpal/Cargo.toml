[package]
name = "silkscreen-cpal"
description = "Audio I/O for standalone silkscreen apps: a cpal stream driving an Engine through the native bridge"
# The library's own version line, apart from the synths'.
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Packageable; crates.io waits on clack's release, so nothing is
# published yet.
publish = true

[dependencies]
silkscreen-bridge.workspace = true
cpal.workspace = true
rtrb.workspace = true

[dev-dependencies]
silkscreen-bridge = { workspace = true, features = ["testing"] }

[lints]
workspace = true
