# Checks every push and pull request. The full list runs on ARM64 macOS,
# the platform the bit-exact snapshot tests are blessed on; elsewhere those
# tests skip themselves, and clippy and the rest of the tests run.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Full (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Build the wasm-safe crates for wasm32
        run: cargo build -p silkscreen-core -p silkscreen-model -p silkscreen-text --target wasm32-unknown-unknown
      - name: Check the bridge without std
        run: cargo check -p silkscreen-bridge --no-default-features
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Every crate but silkscreen-clap (git dependencies) packages and
      # builds from its .crate, as a git or registry user gets it.
      - name: Package
        run: >
          cargo package
          -p silkscreen-core -p silkscreen-text -p silkscreen-model
          -p silkscreen-build -p silkscreen-bridge -p silkscreen
          -p silkscreen-harness -p silkscreen-host-native
          -p silkscreen-host-web -p silkscreen-cpal -p silkscreen-tool
      - name: Template
        working-directory: template
        run: |
          cargo fmt --all --check
          cargo test
          cargo clippy --all-targets -- -D warnings

  semver:
    name: Semver checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is the latest release tag, so fetch tags.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # A breaking change against the latest tag fails until the version
      # is raised (CHANGELOG.md). Examples are publish = false: skipped.
      - name: Semver checks
        run: cargo semver-checks --workspace --baseline-rev "$(git describe --tags --abbrev=0)"

  others:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # `cargo silkscreen bundle --vst3` on each platform: clap-wrapper, the
  # VST3 SDK and CMake end to end, with Steinberg's validator over the
  # result (design/building-and-shipping.md).
  vst3:
    name: VST3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libgtk-3-dev libgtkmm-3.0-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Bundle and validate
        run: cargo silkscreen bundle gain-plugin --vst3 --validate
