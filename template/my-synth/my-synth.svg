<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <!-- My Synth's faceplate. Everything outside the "controls" layer is
       rendered to PNG at build time; each shape inside it marks one
       control's bounds, and its id says what it is: kind.name. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#22242a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="#141518"/>
  <rect x="4" y="4" width="312" height="172" rx="6" fill="url(#panel)" stroke="#4c4f57"/>

  <g font-family="'Jost*'" font-weight="500" fill="#e2e2e6" text-anchor="middle">
    <text x="160" y="30" font-size="16" letter-spacing="3">MY SYNTH</text>
    <text x="95" y="160" font-size="11" letter-spacing="1.5">WAVE</text>
    <text x="225" y="160" font-size="11" letter-spacing="1.5">LEVEL</text>
  </g>

  <!-- A ring under each knob. -->
  <g fill="none" stroke="#6b6e77" stroke-width="2">
    <circle cx="95" cy="95" r="42"/>
    <circle cx="225" cy="95" r="42"/>
  </g>

  <g id="controls">
    <circle id="knob.wave" cx="95" cy="95" r="36" fill="#ff00ff"/>
    <circle id="knob.level" cx="225" cy="95" r="36" fill="#ff00ff"/>
  </g>
</svg>
